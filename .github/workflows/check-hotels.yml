name: Controllo hotel

on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-hotels
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cerca hotel (SerpApi · Google Hotels)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/check_hotels.py
      - name: Salva risultati
        run: |
          git config user.name "hotel-watch-bot"
          git config user.email "hotel-watch-bot@users.noreply.github.com"
          git add data/hotels.json
          git diff --cached --quiet && echo "Nessuna modifica" && exit 0
          git commit -m "Aggiornamento hotel $(date -u +'%Y-%m-%d %H:%M') [skip ci]"
          git pull --rebase
          git push
